<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Oil slick detection">
  <!--
    Radar sweep with an oil drop. Uses the app's own meanings (theme/tokens.ts):
    confirmed oil is red #FF4D4D with a 20% fill, the search sweep is cyan
    #5CE1E6. Drawn to read at 16 px: one shape, one arc, no fine detail.
  -->
  <rect width="32" height="32" rx="7" fill="#0B1220"/>
  <circle cx="16" cy="16" r="12" fill="none" stroke="#1E2A40" stroke-width="1.5"/>
  <!-- radar sweep -->
  <path d="M16 16 L16 4 A12 12 0 0 1 26.4 10" fill="#5CE1E6" fill-opacity="0.22"/>
  <path d="M16 16 L16 4" stroke="#5CE1E6" stroke-width="1.4" stroke-linecap="round"/>
  <!-- oil drop -->
  <path d="M16 11 C16 11 22 18.2 22 21 A6 6 0 0 1 10 21 C10 18.2 16 11 16 11 Z"
        fill="#FF4D4D" fill-opacity="0.2" stroke="#FF4D4D" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
